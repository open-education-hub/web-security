apiVersion: v1
kind: Service
metadata:
  name: escalation-service
  namespace: challenges
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    name: escalation
    chall: misc
    competition: unbreakable21
    phase: group
  ports:
  - protocol: TCP
    port: 1234
    targetPort: 1234
    nodePort: 31050
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: escalation
  namespace: challenges
spec:
  replicas: 1
  selector:
    matchLabels:
      name: escalation
      chall: misc
      competition: unbreakable21
      phase: group
  template:
    metadata:
      labels:
        name: escalation
        chall: misc
        competition: unbreakable21
        phase: group
        networking/allow-internet-egress: 'true'
        networking/allow-dns-egress: 'true'
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        #fsGroup: 2000
      containers:
      - image: docker.io/dockersec/tcpdump
        imagePullPolicy: Always
        name: tcpdumper
        command:
        - /bin/sh
        args:
        - -c
        - TZ=UTC tcpdump -tttt -ni eth0 '(port 1234) and (not (src net 10.128.0.0/16
          or dst net 10.128.0.0/16))'
        securityContext:
          runAsUser: 0
      - name: escalation
        image: gitlab.bit-sentinel.com:5005/bit-sentinel/cyber-edu/challenges/unbreakable/unr21-1/misc/escalation
        securityContext:
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          privileged: false
          capabilities:
            drop:
            - CHOWN
            - SYS_CHROOT
            - NET_RAW
            - SETPCAP
        imagePullPolicy: Always
        resources:
          limits:
            memory: 256Mi
            cpu: 500m
          requests:
            memory: 68Mi
            cpu: 100m
        readinessProbe:
          tcpSocket:
            port: 1234
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          tcpSocket:
            port: 1234
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        ports:
        - containerPort: 1234
      imagePullSecrets:
      - name: gitlab-registry
      restartPolicy: Always
